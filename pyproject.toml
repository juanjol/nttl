[project]
name = "nttl"
version = "0.1.0"
description = "Nighttime Timelapse: high quality night timelapses for astronomy cameras"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.1",
    "astropy>=6.1",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.8",
    "astral>=3.2",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.2"]

[project.scripts]
nttl = "nttl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["hardware: requires a physical camera connected"]
addopts = "-q --strict-markers -m 'not hardware'"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
plugins = []

[[tool.mypy.overrides]]
module = ["cv2.*", "astral.*", "webview.*", "astropy.*"]
ignore_missing_imports = true
